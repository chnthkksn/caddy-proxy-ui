name: Release

# Releases are cut automatically on every merge to main: the first job bumps
# the patch version (vX.Y.Z -> vX.Y.Z+1) and pushes that tag, then the rest
# of the pipeline builds and publishes against it. A manual tag push (for a
# deliberate minor/major bump) or workflow_dispatch also runs the full
# pipeline, using that tag as-is instead of computing a new one.
on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute release tag
        id: compute
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          else
            latest=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
            if [ -z "$latest" ]; then
              tag="v0.1.0"
            else
              version="${latest#v}"
              major="${version%%.*}"
              rest="${version#*.}"
              minor="${rest%%.*}"
              patch="${rest#*.}"
              tag="v${major}.${minor}.$((patch + 1))"
            fi
            git tag "$tag"
            git push origin "$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build-frontend:
    needs: determine-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run build
        working-directory: web

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  build:
    needs: [determine-version, build-frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            suffix: linux_amd64
          - goarch: arm64
            suffix: linux_arm64
          - goarch: arm
            goarm: "7"
            suffix: linux_armv7
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
          VERSION: ${{ needs.determine-version.outputs.tag }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
            -o dist/caddy-ui ./cmd/caddy-ui

      - name: Package
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          cd dist
          # Deliberately unversioned: lets docs use the stable
          # /releases/latest/download/<name> URL without needing to know
          # the current version. The binary itself still reports its real
          # version (baked in via ldflags above), and the release page
          # this asset is attached to is tagged correctly regardless.
          name="caddy-ui_${SUFFIX}"
          tar czf "$name.tar.gz" caddy-ui
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          rm caddy-ui

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.suffix }}
          path: dist/*

  release:
    needs: [determine-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Combine checksums
        working-directory: dist
        run: cat *.sha256 > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.determine-version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt
